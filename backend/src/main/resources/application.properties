spring.application.name=facturacion
# Esta aplicacion se ejecuta como simulacion de homologacion al arrancar sin argumentos.
facturacion.arca-test.enabled=false
facturacion.arca.ambiente=HOMOLOGACION
facturacion.arca.cuit-emisor=${FACTURACION_ARCA_CUIT_EMISOR:20303658441}
facturacion.comprobante.emisor.denominacion=${FACTURACION_EMISOR_DENOMINACION:EMISOR DE PRUEBA - HOMOLOGACION}
facturacion.comprobante.emisor.cuit=${FACTURACION_ARCA_CUIT_EMISOR:20303658441}
facturacion.comprobante.emisor.condicion-iva=${FACTURACION_EMISOR_CONDICION_IVA:IVA Responsable Inscripto}
facturacion.comprobante.emisor.domicilio=${FACTURACION_EMISOR_DOMICILIO:Domicilio de prueba 123}

# Credenciales locales (cada integrante tiene su propio db-local.properties, ignorado por git)
spring.config.import=optional:classpath:db-local.properties

# CONEXIÓN POSTGRESQL (Tomado de tu persistence.xml)
spring.datasource.url=jdbc:postgresql://localhost:5432/TP_GRUPAL_ORM
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HIBERNATE / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# Materialize DTOs inside explicit read-only transactions.
spring.jpa.open-in-view=false
spring.jackson.deserialization.accept-float-as-int=false

facturacion.arca.clave-path=${FACTURACION_ARCA_CLAVE_PATH:classpath:privada_test.key}
facturacion.arca.certificado-path=${FACTURACION_ARCA_CERTIFICADO_PATH:classpath:certificado_test.crt}
facturacion.arca.wsaa-cache-dir=${FACTURACION_ARCA_WSAA_CACHE_DIR:}
